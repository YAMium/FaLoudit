name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.302
          cache: true
          cache-dependency-path: '**/packages.lock.json'
      - name: Restore locked dependencies
        # The CLI lock file also covers the self-contained win-x64 publish graph.
        run: dotnet restore .\FaLoudit.slnx -p:PublishProfile=WinX64 --locked-mode
      - name: Test
        run: dotnet test .\FaLoudit.slnx -c Release --no-restore --nologo
